[workspace]
members = ["crates/wt-core", "crates/wt-tui"]
resolver = "2"

[package]
name = "wt-cli"
version = "1.0.0"
edition = "2021"
default-run = "wt"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
wt-core = { path = "crates/wt-core" }
wt-tui = { path = "crates/wt-tui" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
anyhow = "1"
dirs = "5"
serde_json = "1"
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1", features = ["full"] }
