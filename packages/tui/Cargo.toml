[package]
name = "wt-tui"
version = "1.0.0"
edition = "2021"

[dependencies]
# TUI framework
ratatui = "0.26"
crossterm = "0.27"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Git operations
git2 = "0.18"

# Terminal/PTY
portable-pty = "0.9"
vt100 = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
clap = { version = "4.0", features = ["derive"] }
dirs = "5.0"
shell-words = "1.1"
